name: release
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - LICENSE
      - .gitignore
  workflow_dispatch:

# One release run at a time so pruning never races a publish.
concurrency:
  group: release
  cancel-in-progress: false

env:
  KEEP_RELEASES: 3

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libusb-1.0-0-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm test
      - run: npm run test:rust
      - name: Check signing key
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: test -n "$KEY" || { echo "::error::Add the TAURI_SIGNING_PRIVATE_KEY repository secret (see README, Auto-update)."; exit 1; }
      # Each build gets its own version (major.minor from package.json, patch = run number) so the updater sees it as newer.
      - name: Build
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          VERSION="$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')").${GITHUB_RUN_NUMBER}"
          npx tauri build --config "{\"version\":\"${VERSION}\"}" -- --locked
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Publish release
        run: |
          VERSION="$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')").${GITHUB_RUN_NUMBER}"
          TAG="v${VERSION}"
          # Artifacts keep their bundle subfolders; flatten them, and replace spaces the way GitHub does so urls match.
          mkdir out
          find dist -type f -print0 | while IFS= read -r -d '' f; do cp "$f" "out/$(basename "${f// /.}")"; done
          node scripts/make-latest-json.mjs out "$VERSION" "$TAG" "$GITHUB_REPOSITORY" "Build ${GITHUB_RUN_NUMBER}"
          mapfile -t FILES < <(find out -type f)
          printf 'Uploading:\n%s\n' "${FILES[@]}"
          gh release create "$TAG" "${FILES[@]}" \
            --target "$GITHUB_SHA" \
            --title "Stick Coach ${VERSION}" \
            --generate-notes
      - name: Keep only the latest releases
        run: |
          gh release list --limit 100 --json tagName,createdAt \
            --jq "sort_by(.createdAt) | reverse | .[${KEEP_RELEASES}:] | .[].tagName" |
          while read -r tag; do
            echo "Deleting old release $tag"
            gh release delete "$tag" --cleanup-tag --yes
          done
